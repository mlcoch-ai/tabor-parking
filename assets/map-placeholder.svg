<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8b8"/>
      <stop offset="1" stop-color="#aed17f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grass)"/>

  <!-- Les -->
  <g fill="#7fae5a" opacity="0.55">
    <circle cx="120" cy="120" r="60"/><circle cx="200" cy="90" r="50"/><circle cx="90" cy="200" r="45"/>
    <circle cx="1080" cy="140" r="60"/><circle cx="1120" cy="230" r="45"/><circle cx="1010" cy="110" r="40"/>
  </g>

  <!-- Horní cesta -->
  <path d="M0 180 C 300 120, 700 160, 1200 120" stroke="#c9a06a" stroke-width="46" fill="none" stroke-linecap="round"/>
  <path d="M0 180 C 300 120, 700 160, 1200 120" stroke="#e8cfa3" stroke-width="30" fill="none" stroke-linecap="round" stroke-dasharray="2 26"/>
  <text x="60" y="150" font-family="sans-serif" font-size="26" fill="#5a4326" font-weight="700">Horní cesta</text>

  <!-- Spodní cesta -->
  <path d="M0 660 C 350 700, 750 640, 1200 700" stroke="#c9a06a" stroke-width="46" fill="none" stroke-linecap="round"/>
  <path d="M0 660 C 350 700, 750 640, 1200 700" stroke="#e8cfa3" stroke-width="30" fill="none" stroke-linecap="round" stroke-dasharray="2 26"/>
  <text x="60" y="640" font-family="sans-serif" font-size="26" fill="#5a4326" font-weight="700">Spodní cesta</text>

  <!-- Tábor -->
  <g>
    <rect x="520" y="360" width="180" height="120" rx="10" fill="#8a6d4b"/>
    <polygon points="510,360 610,300 710,360" fill="#6f5236"/>
    <text x="610" y="430" font-family="sans-serif" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">TÁBOR</text>
  </g>

  <!-- Naznačená parkoviště (jen dekorace, skutečné se kreslí v appce) -->
  <g fill="#ffffff" opacity="0.35" stroke="#5a4326" stroke-width="2" stroke-dasharray="8 6">
    <rect x="220" y="540" width="150" height="90" rx="6"/>
    <rect x="430" y="560" width="150" height="90" rx="6"/>
    <rect x="820" y="220" width="160" height="90" rx="6"/>
  </g>

  <text x="600" y="770" font-family="sans-serif" font-size="20" fill="#5a4326" text-anchor="middle" opacity="0.7">
    Ukázková mapa — nahraď vlastním obrázkem tábora (assets/map.jpg)
  </text>
</svg>
