name: Deploy na GitHub Pages

on:
  push:
    branches:
      - claude/camp-parking-app-mz4yq2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Zapne GitHub Pages se zdrojem "GitHub Actions" automaticky,
          # pokud ještě nejsou zapnuté (nemusíš nic klikat v Settings).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Nahraje celý web (statické soubory v kořeni repa)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
